<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Shop Home</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

    <a href="/login">Login</a>
    <a href="/cart">Cart</a>
    <a href="/order/history">Order History</a>
    <h1>Welcome to the Book Shop</h1>

    <section>
        <h2>Available Books</h2>
        <div th:each="product : ${products}" class="product-card">
            <a th:href="@{'/products/detail/' + ${product.productId}}">
                <img th:src="@{'/images/' + ${product.imageName}}" alt="Book Image">
            </a>
            <p><strong th:text="${product.productName}">Book Name</strong</p>
            <p>Price: €<span th:text="${product.productPrice}">0.00</span></p>
        </div>
    </section>

</body>
</html>

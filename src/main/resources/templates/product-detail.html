<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Detail</title>
    <link rel="stylesheet" th:href="@{/css/product-detail.css}">
</head>
<body>
    <div class="top-bar">
        <div class="top-links">
            <a class="nav-btn" th:href="@{/order/history}" th:if="${session.user != null and !session.user.admin}">Order History</a>
            <a class="nav-btn" th:href="@{/cart}" th:if="${session.user != null and !session.user.admin}">Cart</a>
            <a class="nav-btn" th:href="@{/}" th:if="${session.user != null and session.user.admin}">Home</a>
        </div>
    </div>

    <div class="detail-container">
        <div class="left-section">
            <img th:src="${product.imageURL}" alt="Book Image">
        </div>

        <div class="right-section">
            <h1 th:text="${product.productName}">Book Name</h1>

            <div class="description-box">
                <p th:text="${product.productDescription}">Description</p>
            </div>

            <div class="purchase-box">
                <p class="price">
                    Price: €<span th:text="${product.productPrice}">0.00</span>
                </p>

                <form th:action="@{'/cart/add/' + ${product.productId}}" method="post"
                      th:if="${session.user != null and !session.user.admin}">
                    <button type="submit" class="action-btn">Add to Cart</button>
                </form>

                <a class="back-btn" th:href="@{/}">Back</a>
            </div>
        </div>
    </div>
</body>
</html>

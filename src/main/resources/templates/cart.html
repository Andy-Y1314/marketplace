<!DOCTYPE html>
<html lang="en", xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>

    <div class="top-bar">
        <div class="top-links">
            <a class="nav-btn" th:href="@{/}">Home</a>
            <a class="nav-btn" th:href="@{/order/history}">Order History</a>
        </div>
    </div>

    <div class="cart-container">
        <h1>Your Cart</h1>

        <div th:if="${cartProducts.isEmpty()}">
            <p>Your cart is empty.</p>
            <a class="back-btn" th:href="@{/}">Back to Shop</a>
        </div>

        <div th:if="${!cartProducts.isEmpty()}" class="cart-box">
            <div class="cart-header">
                <div>Product</div>
                <div>Price</div>
                <div>Quantity</div>
                <div>Remove</div>
            </div>

            <div class="cart-row" th:each="cp : ${cartProducts}">
                <div class="product-cell">
                    <img th:src="${cp.product.imageURL}" alt="Product Image">
                    <span th:text="${cp.product.productName}">Product Name</span>
                </div>

                <div >
                    €<span th:text="${cp.product.productPrice}">0.00</span>
                </div>

                <div>
                    <form th:action="@{'/cart/update/' + ${cp.product.productId}}" method="post" class="quantity-form">
                        <input type="number" name="quantity" min="0" th:value="${cp.quantity}">
                        <button type="submit" class="update-btn">Update</button>
                    </form>
                </div>

                <div>
                    <form th:action="@{'/cart/remove/' + ${cp.product.productId}}" method="post">
                        <button type="submit" class="remove-btn">Remove</button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${!cartProducts.isEmpty()}" class="cart-footer">
            <h2>Total: €<span th:text="${total}">0.00</span></h2>

            <form th:action="@{/orders/checkout}" method="post">
                <button type="submit" class="pay-btn">Pay</button>
            </form>
        </div>
    </div>

</body>
</html>
